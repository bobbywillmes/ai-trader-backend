name: ai-trader-snapshot-inventory

services:
  postgres:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_USER: snapshot_admin
      POSTGRES_PASSWORD: snapshot_disposable_only
      POSTGRES_DB: ai_trader_snapshot_inventory
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - snapshot_inventory_data:/var/lib/postgresql/data
    networks:
      - snapshot_inventory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapshot_admin -d ai_trader_snapshot_inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  snapshot_inventory:
    internal: true

volumes:
  snapshot_inventory_data:
    labels:
      ai-trader-purpose: disposable-snapshot-inventory
      ai-trader-persistent-source: "false"
